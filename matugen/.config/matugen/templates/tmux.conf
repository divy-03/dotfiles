# generated by matugen from the current wallpaper -- edit the template in ~/.config/matugen/templates
set -g @thm_bg "{{colors.surface_container_low.default.hex}}"
set -g @thm_fg "{{colors.on_surface.default.hex}}"
set -g @thm_crust "{{colors.surface_container_lowest.default.hex}}"
set -g @thm_mantle "{{colors.surface.default.hex}}"
set -g @thm_surface_0 "{{colors.surface_container_highest.default.hex}}"
set -g @thm_surface_1 "{{colors.outline_variant.default.hex}}"
set -g @thm_surface_2 "{{colors.outline_variant.default.hex | lighten: 8}}"
set -g @thm_overlay_0 "{{colors.outline.default.hex | lighten: -10}}"
set -g @thm_overlay_1 "{{colors.outline.default.hex | lighten: -5}}"
set -g @thm_overlay_2 "{{colors.outline.default.hex}}"
set -g @thm_subtext_0 "{{colors.on_surface_variant.default.hex | lighten: -8}}"
set -g @thm_subtext_1 "{{colors.on_surface_variant.default.hex}}"
set -g @thm_rosewater "{{colors.rosewater.default.hex}}"
set -g @thm_flamingo "{{colors.flamingo.default.hex}}"
set -g @thm_pink "{{colors.pink.default.hex}}"
set -g @thm_mauve "{{colors.primary.default.hex}}"
set -g @thm_red "{{colors.red.default.hex}}"
set -g @thm_maroon "{{colors.maroon.default.hex}}"
set -g @thm_peach "{{colors.peach.default.hex}}"
set -g @thm_yellow "{{colors.yellow.default.hex}}"
set -g @thm_green "{{colors.green.default.hex}}"
set -g @thm_teal "{{colors.teal.default.hex}}"
set -g @thm_sky "{{colors.sky.default.hex}}"
set -g @thm_sapphire "{{colors.sapphire.default.hex}}"
set -g @thm_blue "{{colors.blue.default.hex}}"
set -g @thm_lavender "{{colors.tertiary.default.hex}}"

set -g status-style "bg={{colors.surface.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g message-style "bg={{colors.surface_container_highest.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g mode-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}"
set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g window-status-current-style "fg={{colors.primary.default.hex}},bold"
