# generated by matugen from the current wallpaper -- edit the template in ~/.config/matugen/templates
[colors.primary]
background = "{{colors.surface_container_low.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
dim_foreground = "{{colors.on_surface_variant.default.hex}}"
bright_foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
cursor = "{{colors.primary.default.hex}}"
text = "{{colors.on_primary.default.hex}}"

[colors.vi_mode_cursor]
cursor = "{{colors.tertiary.default.hex}}"
text = "{{colors.on_tertiary.default.hex}}"

[colors.selection]
background = "{{colors.primary.default.hex}}"
text = "{{colors.on_primary.default.hex}}"

[colors.search.matches]
background = "{{colors.on_surface_variant.default.hex}}"
foreground = "{{colors.surface_container_low.default.hex}}"

[colors.search.focused_match]
background = "{{colors.green.default.hex}}"
foreground = "{{colors.surface_container_low.default.hex}}"

[colors.hints.start]
background = "{{colors.yellow.default.hex}}"
foreground = "{{colors.surface_container_low.default.hex}}"

[colors.hints.end]
background = "{{colors.on_surface_variant.default.hex}}"
foreground = "{{colors.surface_container_low.default.hex}}"

[colors.normal]
black = "{{colors.outline_variant.default.hex}}"
red = "{{colors.red.default.hex}}"
green = "{{colors.green.default.hex}}"
yellow = "{{colors.yellow.default.hex}}"
blue = "{{colors.blue.default.hex}}"
magenta = "{{colors.pink.default.hex}}"
cyan = "{{colors.teal.default.hex}}"
white = "{{colors.on_surface_variant.default.hex}}"

[colors.bright]
black = "{{colors.outline_variant.default.hex | lighten: 8}}"
red = "{{colors.red.default.hex | lighten: 5}}"
green = "{{colors.green.default.hex | lighten: 5}}"
yellow = "{{colors.yellow.default.hex | lighten: 5}}"
blue = "{{colors.blue.default.hex | lighten: 5}}"
magenta = "{{colors.pink.default.hex | lighten: 5}}"
cyan = "{{colors.teal.default.hex | lighten: 5}}"
white = "{{colors.on_surface.default.hex}}"

[colors.dim]
black = "{{colors.outline_variant.default.hex}}"
red = "{{colors.red.default.hex}}"
green = "{{colors.green.default.hex}}"
yellow = "{{colors.yellow.default.hex}}"
blue = "{{colors.blue.default.hex}}"
magenta = "{{colors.pink.default.hex}}"
cyan = "{{colors.teal.default.hex}}"
white = "{{colors.on_surface_variant.default.hex}}"

[[colors.indexed_colors]]
color = "{{colors.peach.default.hex}}"
index = 16

[[colors.indexed_colors]]
color = "{{colors.rosewater.default.hex}}"
index = 17
