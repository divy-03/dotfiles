# generated by matugen from the current wallpaper -- edit the template in ~/.config/matugen/templates

[mgr]
cwd = { fg = "{{colors.teal.default.hex}}" }
find_keyword  = { fg = "{{colors.yellow.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.pink.default.hex}}", bg = "reset", bold = true, italic = true }
marker_copied   = { fg = "{{colors.green.default.hex}}", bg = "{{colors.green.default.hex}}" }
marker_cut      = { fg = "{{colors.red.default.hex}}", bg = "{{colors.red.default.hex}}" }
marker_marked   = { fg = "{{colors.teal.default.hex}}", bg = "{{colors.teal.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
count_copied   = { fg = "{{colors.surface_container_low.default.hex}}", bg = "{{colors.green.default.hex}}" }
count_cut      = { fg = "{{colors.surface_container_low.default.hex}}", bg = "{{colors.red.default.hex}}" }
count_selected = { fg = "{{colors.surface_container_low.default.hex}}", bg = "{{colors.primary.default.hex}}" }
border_style  = { fg = "{{colors.outline_variant.default.hex}}" }

[indicator]
parent  = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex | lighten: -15}}" }
current = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
preview = { underline = true }

[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }
select_main = { fg = "{{colors.surface_container_low.default.hex}}", bg = "{{colors.green.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.green.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }
unset_main  = { fg = "{{colors.surface_container_low.default.hex}}", bg = "{{colors.red.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.red.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }

[status]
overall    = { fg = "{{colors.on_surface.default.hex}}" }
perm_sep   = { fg = "{{colors.outline.default.hex}}" }
perm_type  = { fg = "{{colors.blue.default.hex}}" }
perm_read  = { fg = "{{colors.yellow.default.hex}}" }
perm_write = { fg = "{{colors.red.default.hex}}" }
perm_exec  = { fg = "{{colors.green.default.hex}}" }
progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }
progress_error  = { fg = "{{colors.red.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }

[which]
mask            = { bg = "{{colors.surface.default.hex}}" }
cand            = { fg = "{{colors.teal.default.hex}}" }
rest            = { fg = "{{colors.outline.default.hex}}" }
desc            = { fg = "{{colors.pink.default.hex}}" }
separator_style = { fg = "{{colors.outline_variant.default.hex}}" }

[confirm]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}" }
btn_yes = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[spot]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
tbl_col  = { fg = "{{colors.primary.default.hex}}" }
tbl_cell = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.green.default.hex}}" }
title_warn  = { fg = "{{colors.yellow.default.hex}}" }
title_error = { fg = "{{colors.red.default.hex}}" }

[pick]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.pink.default.hex}}", bold = true }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
selected = { reversed = true }

[cmp]
border = { fg = "{{colors.primary.default.hex}}" }

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.pink.default.hex}}", bold = true }

[help]
on      = { fg = "{{colors.teal.default.hex}}" }
run     = { fg = "{{colors.pink.default.hex}}" }
hovered = { reversed = true, bold = true }
footer  = { fg = "{{colors.surface_container_low.default.hex}}", bg = "{{colors.on_surface.default.hex}}" }

[filetype]
rules = [
	{ mime = "image/*", fg = "{{colors.teal.default.hex}}" },
	{ mime = "{audio,video}/*", fg = "{{colors.yellow.default.hex}}" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{colors.pink.default.hex}}" },
	{ mime = "application/{pdf,doc,rtf}", fg = "{{colors.green.default.hex}}" },
	{ url = "*", is = "orphan", bg = "{{colors.red.default.hex}}" },
	{ url = "*", is = "exec", fg = "{{colors.green.default.hex}}" },
	{ url = "*/", fg = "{{colors.primary.default.hex}}" },
]
