# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

source = ~/.config/hypr/colors.conf

$font = Monospace

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}


general {
    # Visible so the player buttons can be clicked.
    hide_cursor = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}


# CAVA VISUALIZER
# Across the bottom of the screen, half its height, behind everything else. The
# script keeps a cava daemon alive for as long as hyprlock is up and this only
# prints its newest frame -- see the script header for why it cannot simply run
# cava here. Blank whenever nothing is playing. Width and height come from
# cava/.config/cava/hyprlock-config (bars and ascii_max_range) at this font size.
label {
    monitor =
    text = cmd[update:50] ~/.config/hypr/Scripts/cava-hyprlock.sh
    color = rgba($mauveAlpha66)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, 0
    halign = center
    valign = bottom
    zindex = 0
}

# Time-Hour
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color = $text
    font_size = 125
    font_family = StretchPro
    position = -80, 244
    zindex = 1
    halign = center
    valign = center
}

# Time-Minute
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%M")</span>"
    color = $mauve
    font_size = 125
    font_family = StretchPro
    position = 0, 124
    zindex = 1
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B, %a.")"
    color = $subtext1
    font_size = 22
    font_family = Suisse Int'l Mono
    position = 20, 46
    zindex = 1
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =   Welcome $USER
    color = $subtext1
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 22
    font_family = SF Pro Display Bold
    position = 0, -273
    zindex = 1
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $crust
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <span foreground="##ffffff99">Enter Pass</span>
    hide_input = false
    position = 0, -343
    zindex = 1
    halign = center
    valign = center
}

# MEDIA PLAYER
# A card between the date and the password field: album art on its top edge,
# title, artist, controls and a progress bar. Everything is filled in by
# Scripts/player-hyprlock.sh and goes blank (the card itself turns transparent)
# when nothing is playing. The card image is 300x231 and centered at 0, -117, so
# it spans y = -2 down to -233; the widgets below sit on top of it.

image {
    monitor =
    path = ~/.cache/hyprlock-player/empty.png
    size = 231 # the shorter side; the image is 300x231
    rounding = 0
    border_size = 0
    reload_time = 1
    reload_cmd = ~/.config/hypr/Scripts/player-hyprlock.sh card
    position = 0, -117
    halign = center
    valign = center
    zindex = 2
}

# Title
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/player-hyprlock.sh title
    color = $text
    font_size = 14
    font_family = SF Pro Display Bold
    position = 0, -129
    halign = center
    valign = center
    zindex = 3
}

# Artist
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/player-hyprlock.sh artist
    color = $subtext1
    font_size = 10
    font_family = SF Pro Display Bold
    position = 0, -151
    halign = center
    valign = center
    zindex = 3
}

# Controls: shuffle, previous, play/pause, next, repeat, drawn as one label --
# each widget command costs hyprlock's main thread time, and five of them twice
# a second made the visualizer stutter. Shuffle and repeat only show up for
# players that support them (browsers do not).
label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/Scripts/player-hyprlock.sh controls
    color = $text
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -181
    halign = center
    valign = center
    zindex = 3
}

# Click targets for those buttons: invisible static labels (no command, so no
# timer) over each icon. The row is monospace with the buttons four cells
# apart, so the icons sit at 0, +-50 and +-98.
label {
    monitor =
    text = 󰒟
    onclick = ~/.config/hypr/Scripts/player-hyprlock.sh ctl shuffle toggle
    color = rgba(00000001)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -98, -181
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = 󰒮
    onclick = ~/.config/hypr/Scripts/player-hyprlock.sh ctl previous
    color = rgba(00000001)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -50, -181
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = 󰐊
    onclick = ~/.config/hypr/Scripts/player-hyprlock.sh ctl play-pause
    color = rgba(00000001)
    font_size = 19
    font_family = JetBrainsMono Nerd Font
    position = 0, -181
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = 󰒭
    onclick = ~/.config/hypr/Scripts/player-hyprlock.sh ctl next
    color = rgba(00000001)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 50, -181
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = 󰑖
    onclick = ~/.config/hypr/Scripts/player-hyprlock.sh loop-cycle
    color = rgba(00000001)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 98, -181
    halign = center
    valign = center
    zindex = 4
}

# Progress bar and elapsed / total time
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/player-hyprlock.sh progress
    color = $subtext1
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = 0, -211
    halign = center
    valign = center
    zindex = 3
}
