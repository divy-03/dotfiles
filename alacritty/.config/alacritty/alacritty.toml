[general]
# colors are generated by ~/.config/theme/theme (Super+Shift+G)
import = ["~/.config/alacritty/colors.toml"]

[font]
size = 12

[font.bold]
family = "FiraCode Nerd Font Propo"
style = "Bold"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "FiraCode Nerd Font SemBd"
style = "Italic"

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 0

[window]
decorations = "none"

[window.dimensions]
columns = 100
lines = 24
