// Loads ~/.config/theme/zen/theme-boost.sys.mjs; installed next to the zen binary by ~/.config/theme/theme (autoconfig skips this first line)
try {
  const dir = Cc["@mozilla.org/file/directory_service;1"]
    .getService(Ci.nsIProperties)
    .get("Home", Ci.nsIFile);
  for (const part of [".config", "theme", "zen"]) {
    dir.append(part);
  }
  if (dir.exists()) {
    const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
    io.getProtocolHandler("resource")
      .QueryInterface(Ci.nsIResProtocolHandler)
      .setSubstitution("desktop-theme", io.newFileURI(dir));
    ChromeUtils.importESModule("resource://desktop-theme/theme-boost.sys.mjs");
  }
} catch (e) {
  // a throw here would make Zen show an error dialog at every start
  console.error("theme-boost:", e);
}
