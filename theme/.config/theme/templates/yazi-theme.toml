# generated by ~/.config/theme/theme ({{name}}) -- edit the template in ~/.config/theme/templates

[mgr]
cwd = { fg = "{{teal}}" }
find_keyword  = { fg = "{{yellow}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{pink}}", bg = "reset", bold = true, italic = true }
marker_copied   = { fg = "{{green}}", bg = "{{green}}" }
marker_cut      = { fg = "{{red}}", bg = "{{red}}" }
marker_marked   = { fg = "{{teal}}", bg = "{{teal}}" }
marker_selected = { fg = "{{accent}}", bg = "{{accent}}" }
count_copied   = { fg = "{{base}}", bg = "{{green}}" }
count_cut      = { fg = "{{base}}", bg = "{{red}}" }
count_selected = { fg = "{{base}}", bg = "{{accent}}" }
border_style  = { fg = "{{surface1}}" }

[indicator]
parent  = { fg = "{{on_accent}}", bg = "{{accent | lighten: -15}}" }
current = { fg = "{{on_accent}}", bg = "{{accent}}" }
preview = { underline = true }

[tabs]
active   = { fg = "{{on_accent}}", bg = "{{accent}}", bold = true }
inactive = { fg = "{{accent}}", bg = "{{surface0}}" }

[mode]
normal_main = { fg = "{{on_accent}}", bg = "{{accent}}", bold = true }
normal_alt  = { fg = "{{accent}}", bg = "{{surface0}}" }
select_main = { fg = "{{base}}", bg = "{{green}}", bold = true }
select_alt  = { fg = "{{green}}", bg = "{{surface0}}" }
unset_main  = { fg = "{{base}}", bg = "{{red}}", bold = true }
unset_alt   = { fg = "{{red}}", bg = "{{surface0}}" }

[status]
overall    = { fg = "{{text}}" }
perm_sep   = { fg = "{{overlay2}}" }
perm_type  = { fg = "{{blue}}" }
perm_read  = { fg = "{{yellow}}" }
perm_write = { fg = "{{red}}" }
perm_exec  = { fg = "{{green}}" }
progress_label  = { fg = "{{text}}", bold = true }
progress_normal = { fg = "{{accent}}", bg = "{{surface0}}" }
progress_error  = { fg = "{{red}}", bg = "{{surface0}}" }

[which]
mask            = { bg = "{{mantle}}" }
cand            = { fg = "{{teal}}" }
rest            = { fg = "{{overlay2}}" }
desc            = { fg = "{{pink}}" }
separator_style = { fg = "{{surface1}}" }

[confirm]
border  = { fg = "{{accent}}" }
title   = { fg = "{{accent}}" }
btn_yes = { fg = "{{on_accent}}", bg = "{{accent}}" }

[spot]
border   = { fg = "{{accent}}" }
title    = { fg = "{{accent}}" }
tbl_col  = { fg = "{{accent}}" }
tbl_cell = { fg = "{{on_accent}}", bg = "{{accent}}" }

[notify]
title_info  = { fg = "{{green}}" }
title_warn  = { fg = "{{yellow}}" }
title_error = { fg = "{{red}}" }

[pick]
border = { fg = "{{accent}}" }
active = { fg = "{{pink}}", bold = true }

[input]
border   = { fg = "{{accent}}" }
selected = { reversed = true }

[cmp]
border = { fg = "{{accent}}" }

[tasks]
border  = { fg = "{{accent}}" }
hovered = { fg = "{{pink}}", bold = true }

[help]
on      = { fg = "{{teal}}" }
run     = { fg = "{{pink}}" }
hovered = { reversed = true, bold = true }
footer  = { fg = "{{base}}", bg = "{{text}}" }

[filetype]
rules = [
	{ mime = "image/*", fg = "{{teal}}" },
	{ mime = "{audio,video}/*", fg = "{{yellow}}" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{pink}}" },
	{ mime = "application/{pdf,doc,rtf}", fg = "{{green}}" },
	{ url = "*", is = "orphan", bg = "{{red}}" },
	{ url = "*", is = "exec", fg = "{{green}}" },
	{ url = "*/", fg = "{{accent}}" },
]
