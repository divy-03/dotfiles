# generated by ~/.config/theme/theme ({{name}}) -- edit the template in ~/.config/theme/templates
[colors.primary]
background = "{{term_bg}}"
foreground = "{{term_fg}}"
dim_foreground = "{{subtext1}}"
bright_foreground = "{{text}}"

[colors.cursor]
cursor = "{{term_cursor}}"
text = "{{term_cursor_text}}"

[colors.vi_mode_cursor]
cursor = "{{lavender}}"
text = "{{crust}}"

[colors.selection]
background = "{{term_selection_bg}}"
text = "{{term_selection_fg}}"

[colors.search.matches]
background = "{{subtext1}}"
foreground = "{{base}}"

[colors.search.focused_match]
background = "{{green}}"
foreground = "{{base}}"

[colors.hints.start]
background = "{{yellow}}"
foreground = "{{base}}"

[colors.hints.end]
background = "{{subtext1}}"
foreground = "{{base}}"

[colors.normal]
black = "{{color0}}"
red = "{{color1}}"
green = "{{color2}}"
yellow = "{{color3}}"
blue = "{{color4}}"
magenta = "{{color5}}"
cyan = "{{color6}}"
white = "{{color7}}"

[colors.bright]
black = "{{color8}}"
red = "{{color9}}"
green = "{{color10}}"
yellow = "{{color11}}"
blue = "{{color12}}"
magenta = "{{color13}}"
cyan = "{{color14}}"
white = "{{color15}}"

[colors.dim]
black = "{{color0}}"
red = "{{color1}}"
green = "{{color2}}"
yellow = "{{color3}}"
blue = "{{color4}}"
magenta = "{{color5}}"
cyan = "{{color6}}"
white = "{{color7}}"

[[colors.indexed_colors]]
color = "{{peach}}"
index = 16

[[colors.indexed_colors]]
color = "{{rosewater}}"
index = 17
